    <!-- Arm -->
    <path d="M -16 10 C -12 -2 -2 -14 12 -6 C 8 -2 2 4 -4 14" fill="#3A3836" />
    <path d="M -8 2 C -4 -4 4 -8 10 -4" />
    <!-- Axe handle & head -->
