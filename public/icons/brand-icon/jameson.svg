<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" fill="none">
  <!-- Curved/Arched text for JAMESON -->
  <path id="curve" d="M 12 30 Q 70 20 128 30" fill="transparent" />
  <text font-family="'Source Serif 4', 'Times New Roman', Georgia, serif" font-size="20" font-weight="900" fill="#00382B" letter-spacing="2">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      JAMESON
    </textPath>
  </text>
  <!-- Red seal below -->
  <g transform="translate(70, 44)">
    <circle r="10" fill="#8F1D2C" />
    <circle r="8.5" fill="none" stroke="#D1A762" stroke-width="0.8" />
    <path d="M -5 -2 L 5 -2 M -6 0 L 6 0 M -4 2 L 4 2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" />
    <circle r="3.5" fill="#D1A762" />
    <text y="1" font-family="sans-serif" font-size="3" font-weight="bold" fill="#8F1D2C" text-anchor="middle">JJ&amp;S</text>
  </g>
